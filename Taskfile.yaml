version: "3"

tasks:

  run:
    desc: Build and run the application.
    dir: application
    cmd: zig build run

  build:
    desc: Build the application.
    dir: application
    cmd: zig build

  check:
    desc: Check syntax
    dir: application
    cmd: zig ast-check source/main.zig
  
  test:
    dir: application
    cmd: zig build test

  start:
    desc: Start the application from an existing binary.
    dir: application
    cmd: ./zig-out/bin/Valdala
    
  setup:
    desc: Setup development environment.
    cmds:
      - task: init-submodules
      - task: build-wgpu
      # Only required if your current one is older than 3.4.
      - task: build-glfw
  
  init-submodules:
    desc: Initialize all git submodules.
    cmd: git submodule update --init --recursive
  
  build-glfw:
    desc: Build GLFW. 
    dir: application/submodules/glfw
    cmds:
      - cmake -S . -B build
      - make -C build
      - cp build/src/libglfw3.a ../../libraries